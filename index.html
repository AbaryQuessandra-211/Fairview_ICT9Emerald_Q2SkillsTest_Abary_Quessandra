<div class="container mt-3">
    <div class="row">
        <div class="col bg-light" id="forum">
            <div class="col">
            <h2>Student Information</h2>

            <form>
                <div class="row">
                    <div class="col">
                            <label for="usr">First Name:</label>
                            <input type="text" placeholder="John" class="form-control" id="usr" required>
                        </div>

                        <div class="col">
                            <label for="usr">Last Name:</label>
                            <input type="text" placeholder="Doe" class="form-control" id="usr" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                            <label for="date">Birth Date</label>
                            <input type="date" class="form-control" id="date">
                    </div>

                    <div class="col">
                            <label for="gender">Gender</label>
                            <select class="form-select">
                                <option>Female</option>
                                <option>Male</option>
                                <option>Prefer Not To Say</option>
                            </select>
                    </div>

                    <div class="col">
                            <label for="grade">Grade Level</label>
                            <select class="form-select">
                                <option>CASA (Ages 3-5)</option>
                                <option>Primary (Ages 6-8)</option>
                                <option>Intermediate (Ages 9-12)</option>
                                <option>Junior High (Ages 13-16)</option>
                                <option>Senior High (Ages 17-18)</option>
                            </select>
                    </div>

                    <br>

                <h2>Contact Details</h2>

                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label for="email">Email address:</label>
                            <input type="email" class="form-control" placeholder="studentexample@example.com" id="email" required>
                        </div>

                <br>

                        <div class="form-group">
                            <label for="usr">Contact Number</label>
                            <input type="text" class="form-control" placeholder="xxxx-xxx-xxxx" id="usr" required>
                        </div>

                <br>

                <h2>Other Information</h2>
                
                        <p> Mode of Learning</p>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="online" name="Online" value="something" check>
                            <label class="form-check-label">Online</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="F2F" name="Face-to-Face" value="something" check>
                            <label class="form-check-label">Face-to-Face</label>
                        </div>

                        <br>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="agreed" name="agreed" value="something" check>
                            <label class="form-check-label">I confirm that the information inputted are true and complete.</label>
                        </div>


                </div>
                </div>
                </div>

                <br>

                <div class="row justify-content-center mx-auto" style="width: 100px;">
                <button type="submit" class="btn btn-primary" >Submit!</button>
                </div>

                </div>
            </form>
        </div>
    </div>
</div>
